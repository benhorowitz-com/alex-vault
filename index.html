<!--
  ═════════════════════════════════════════════════════
  🕵️  AGENT HQ — SECRET VAULT
  ═════════════════════════════════════════════════════
  This WHOLE website lives in this one file.
  Scroll down to the bottom to find your missions!
  Look for the 🎯 marks.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 👇 CHANGE THIS to your own name -->
  <title>Agent Alex's Secret Vault</title>

  <style>
    /* ── the whole page ─────────────────────────── */
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: #0d1b2a;
      color: #e0e1dd;
      font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1 { margin: 0; font-size: 34px; }
    .subtitle { margin: 0; opacity: 0.7; }

    /* ── the vault: a treasure room with a door on top ── */
    .vault {
      position: relative;
      width: 280px;
      height: 280px;
      perspective: 1000px;
      margin: 10px 0;
    }

    .treasure-room {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      border: 6px solid #55606d;
      border-radius: 18px;
      background: radial-gradient(circle, #4a3a10, #14100a);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .treasure {
      font-size: 90px;
      display: inline-block;
      animation: cute-bounce 1.2s ease-in-out infinite;
    }
    @keyframes cute-bounce {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-14px) rotate(8deg); }
    }

    .vault-door {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      border: 6px solid #2b2d42;
      border-radius: 18px;
      background: linear-gradient(145deg, #8d99ae, #55606d);
      display: flex;
      justify-content: center;
      align-items: center;
      /* the door swings on its LEFT edge, like a real hinge */
      transform-origin: left center;
      transition: transform 1.6s ease-in-out;
    }

    /* when the door gets the "open" tag, it swings! */
    .vault-door.open { transform: rotateY(-110deg); }

    /* the spinny wheel on the front of the door */
    .vault-wheel {
      width: 110px;
      height: 110px;
      border: 12px solid #2b2d42;
      border-radius: 50%;
      position: relative;
    }
    .vault-wheel::before, .vault-wheel::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      background: #2b2d42;
    }
    .vault-wheel::before { width: 106px; height: 12px; transform: translate(-50%, -50%); }
    .vault-wheel::after  { width: 12px; height: 106px; transform: translate(-50%, -50%); }

    /* the door wobbles when the code is wrong */
    .vault-door.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { translate: 0; }
      25%      { translate: -10px; }
      75%      { translate: 10px; }
    }

    /* ── the code box and button ─────────────────── */
    input {
      padding: 12px 16px;
      font-size: 18px;
      font-family: inherit;
      text-align: center;
      color: #e0e1dd;
      background: #1b263b;
      border: 2px solid #55606d;
      border-radius: 10px;
    }

    button {
      padding: 12px 26px;
      font-size: 18px;
      font-family: inherit;
      font-weight: bold;
      color: #2b2d42;
      background: #e9c46a;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #f4a261; }

    .message { min-height: 28px; margin: 0; font-size: 20px; }

    /* 🏆 your mission badges land here */
    .trophy-shelf { min-height: 34px; margin: 0; font-size: 26px; letter-spacing: 6px; }

    /* ── the sticky note somebody left behind… ───── */
    .sticky-note {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 110px;
      min-height: 95px;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffe66d;
      color: #333;
      font-size: 15px;
      rotate: -6deg;
      box-shadow: 4px 6px 10px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    /* ── confetti!!! ─────────────────────────────── */
    .confetti {
      position: fixed;
      top: -40px;
      font-size: 26px;
      pointer-events: none;
      animation-name: fall;
      animation-timing-function: linear;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    footer { margin-top: auto; padding-top: 20px; font-size: 14px; opacity: 0.6; }

    /* ── wrong-code vault clones, piling up on screen ── */
    .vault-clone {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <h1>🔐 Agent Alex's Secret Vault</h1>
  <p class="subtitle">Top secret. Agents only.</p>

  <div class="vault">
    <div class="treasure-room">
      <div class="treasure" id="treasureSpot"></div>
      <p>YOU'RE IN! 🎉</p>
    </div>
    <div class="vault-door" id="vaultDoor">
      <div class="vault-wheel"></div>
    </div>
  </div>

  <input id="codeInput" type="text" placeholder="enter the secret code…" autocomplete="off">
  <button id="openButton">OPEN THE VAULT</button>
  <p class="message" id="message"></p>

  <!-- 🏆 TROPHY SHELF — HQ adds a badge here after every mission you finish -->
  <p class="trophy-shelf" id="trophyShelf"></p>

  <div class="sticky-note" id="stickyNote">🤫<br>tap me</div>

  <!-- 👇 CHANGE THIS to your own name too (HQ bumps the version number) -->
  <footer>Agent HQ · built by Agent Alex · Vault v1</footer>

  <script>
    // ═══════════════════════════════════════════════
    // 🎯 MISSION 1: SET YOUR OWN SECRET CODE
    // The vault opens when someone types this exact code.
    // 👇 CHANGE THIS from "changeme" to your own secret code!
    const SECRET_PASSWORD = "145678901";
    // ═══════════════════════════════════════════════

    // ═══════════════════════════════════════════════
    // 🎯 MISSION 2: PICK YOUR TREASURE
    // This is what agents find when the door swings open.
    // 👇 CHANGE THIS to any emoji you love! 💎 🐉 🍕 🚀
    // (parked for now — we drew our own custom poop below instead,
    // so it looks the same cute way on every computer. Ask HQ to
    // switch back to a plain emoji treasure any time!)
    const TREASURE = "💩✨";
    // ═══════════════════════════════════════════════

    // grab the pieces of the page we need to control
    const vaultDoor = document.getElementById("vaultDoor");
    const treasureSpot = document.getElementById("treasureSpot");
    const codeInput = document.getElementById("codeInput");
    const openButton = document.getElementById("openButton");
    const message = document.getElementById("message");
    const stickyNote = document.getElementById("stickyNote");

    // put the treasure inside the vault, ready to be found
    // 👇 emoji look different on every computer (Windows draws 💩 differently
    // than a Mac does) — so instead of using the emoji, we drew our OWN cute
    // poop with googly eyes. Now it looks exactly the same everywhere!
    treasureSpot.innerHTML =
      '<svg viewBox="0 0 200 220" width="120" height="132">' +
      // one swirly coil body (softer + rounder than emoji-style stacked lobes)
      '<path d="M100 205 C 55 205 40 170 55 148 C 38 136 42 105 70 92 C 54 80 60 55 85 45 C 74 38 82 18 100 12 C 118 18 126 38 115 45 C 140 55 146 80 130 92 C 158 105 162 136 145 148 C 160 170 145 205 100 205 Z" fill="#a97c50"/>' +
      '<ellipse cx="80" cy="70" rx="18" ry="10" fill="#c79b6e" opacity="0.6"/>' +
      // big sparkly kawaii eyes with tiny highlight dots
      '<ellipse cx="78" cy="120" rx="16" ry="18" fill="#2b2b2b"/>' +
      '<ellipse cx="122" cy="120" rx="16" ry="18" fill="#2b2b2b"/>' +
      '<circle cx="83" cy="112" r="5" fill="white"/>' +
      '<circle cx="127" cy="112" r="5" fill="white"/>' +
      '<circle cx="73" cy="126" r="3" fill="white" opacity="0.8"/>' +
      '<circle cx="117" cy="126" r="3" fill="white" opacity="0.8"/>' +
      // big rosy cheeks
      '<ellipse cx="58" cy="140" rx="12" ry="7" fill="#ffb6c1" opacity="0.85"/>' +
      '<ellipse cx="142" cy="140" rx="12" ry="7" fill="#ffb6c1" opacity="0.85"/>' +
      // tiny smile
      '<path d="M88 145 Q100 156 112 145" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      // floating sparkles
      '<text x="18" y="42" font-size="20">✨</text>' +
      '<text x="152" y="32" font-size="16">✨</text>' +
      '<text x="148" y="182" font-size="14">✨</text>' +
      "</svg>";

    function tryToOpenTheVault() {
      const guess = codeInput.value;

      if (guess === SECRET_PASSWORD) {
        // right code → the door swings open — and so does every clone door!
        document.querySelectorAll(".vault-door").forEach(function (door) {
          door.classList.add("open");
        });
        message.textContent = "ACCESS GRANTED, AGENT! 🟢";
        throwConfetti();
      } else {
        // wrong code → the door wobbles and stays shut
        vaultDoor.classList.add("shake");
        message.textContent = "ACCESS DENIED ⛔ try again!";
        setTimeout(function () {
          vaultDoor.classList.remove("shake");
        }, 500);

        // every wrong guess spawns another copy of the vault on screen!
        duplicateTheVault();
      }
    }

    // stamp a shrunken copy of the vault somewhere random on the page
    function duplicateTheVault() {
      const original = document.querySelector(".vault");
      const clone = original.cloneNode(true);
      clone.classList.add("vault-clone");
      clone.style.left = Math.random() * 80 + "vw";
      clone.style.top = Math.random() * 70 + "vh";
      const scale = 0.3 + Math.random() * 0.4;
      const spin = Math.random() * 40 - 20;
      clone.style.transform = "scale(" + scale + ") rotate(" + spin + "deg)";
      document.body.appendChild(clone);
    }

    // the button opens the vault…
    openButton.addEventListener("click", tryToOpenTheVault);

    // …and so does pressing Enter in the code box
    codeInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        tryToOpenTheVault();
      }
    });

    // somebody wrote the secret code on a sticky note… oops 😉
    stickyNote.addEventListener("click", function () {
      stickyNote.textContent = "the code is: " + SECRET_PASSWORD;
    });

    // rain 50 pieces of confetti from the top of the screen
    function throwConfetti() {
      const confettiShapes = ["💩"];
      for (let i = 0; i < 50; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.textContent = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDuration = 2 + Math.random() * 2 + "s";
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        document.body.appendChild(piece);
        piece.addEventListener("animationend", function () {
          piece.remove();
        });
      }
    }
  </script>
</body>
</html>
